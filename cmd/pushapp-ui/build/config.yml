# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
#
# The `info` block below used to be untouched Wails template boilerplate ("My
# Company"/"My Product"), even though the generated assets under darwin/,
# windows/ and linux/ already carried the real product name and bundle ID from
# `wails3 init` — so config.yml and the assets it regenerates had silently
# drifted apart. Anyone running `wails3 task common:update:build-assets` would
# have overwritten the good names with the template ones. Filled in 2026-08-18
# to match the assets; keep the two in sync.
#
# Desktop only: there is no `ios:` block and no build/ios or build/android
# directory. Both were deleted — see cmd/pushapp-ui/Taskfile.yml for why.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Federico Pepe" # The name of the company
  productName: "Push Tethered App" # The name of the application
  productIdentifier: "com.federicopepe.push-tethered-app" # The unique product identifier
  description: "Module host for Ableton Push 2/3 in tethered mode" # The application description
  copyright: "© 2026, Federico Pepe" # Copyright text
  comments: "Owns Push's display, pads, buttons, encoders and LEDs, and runs modules on it." # Comments
  version: "0.1.0" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
#  - ext: wails
#    name: Wails
#    description: Wails Application File
#    iconName: wailsFileIcon
#    role: Editor
#  - ext: jpg
#    name: JPEG
#    description: Image File
#    iconName: jpegFileIcon
#    role: Editor
#    mimeType: image/jpeg  # (optional)

# Other data
other:
  - name: My Other Data